name = "mpintellect"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./out"

[[d1_databases]]
binding = "DB"
database_name = "mpintellect-db"
database_id = "074ccc04-d574-4164-8f48-0b6444b9db88"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "mpintellect-private-vault"

[[r2_buckets]]
binding = "AD_STORAGE"
bucket_name = "mpintellect-ads"

[[r2_buckets]]
binding = "ASSETS_STORAGE"
bucket_name = "assets"