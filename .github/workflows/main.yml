name: MZ Intelligence Ad Warmup
on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC
    - cron: '0 21 * * *' # 9 PM UTC
  workflow_dispatch:      # Allows you to run it manually for testing

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger MZ Warmup API
        run: |
          curl -X GET "https://mzprimer.com/api/ads/warmup" \
          -H "Authorization: Bearer ${{ secrets.WARMUP_KEY }}"
