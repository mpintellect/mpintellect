name: MZ Ad Warmup (Pre-Render)

on:
  schedule:
    - cron: '30 0 * * *'  # 00:30 UTC
    - cron: '30 12 * * *' # 12:30 UTC
  workflow_dispatch:      # Play button

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Bake 8 Symbols
        run: |
          SYMBOLS=("EURUSD" "GBPUSD" "XAUUSD" "BTCUSD" "ETHUSD" "US500" "USTEC" "BRENT")
          for sym in "${SYMBOLS[@]}"
          do
            echo "🔥 Baking $sym..."
            curl -s "https://mzprimer.com/api/ads/warmup?key=${{ secrets.ADMIN_KEY }}&symbol=$sym"
            sleep 45
          done

      - name: 🏁 Flip the Safety Switch
        run: |
          echo "✅ Baking finished. Activating current version..."
          curl -s "https://mzprimer.com/api/ads/activate-version?key=${{ secrets.ADMIN_KEY }}"