name: MZ Ad Warmup (Pre-Render)
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: 🔥 Bake 144 Images
        run: |
          SYMBOLS=("EURUSD" "GBPUSD" "XAUUSD" "BTCUSD" "ETHUSD" "US500" "USTEC" "BRENT")
          TYPES=("test" "chat" "update" "volatility")
          SIZES=("standard" "square" "portrait")

          for sym in "${SYMBOLS[@]}"; do
            for type in "${TYPES[@]}"; do
              # Logic: test and chat get both. Others get black only.
              STYLES=("black")
              if [[ "$type" == "test" || "$type" == "chat" ]]; then STYLES=("black" "cyber"); fi

              for style in "${STYLES[@]}"; do
                for size in "${SIZES[@]}"; do
                  echo "🚀 Baking $sym-$type-$style-$size"
                  curl --fail -s "https://mzprimer.com/api/ads/warmup?key=${{ secrets.ADMIN_KEY }}&symbol=$sym&type=$type&style=$style&size=$size"
                  sleep 4
                done
              done
            done
          done

      - name: 🏁 Activate
        run: curl -s "https://mzprimer.com/api/ads/activate-version?key=${{ secrets.ADMIN_KEY }}"